    <h2>Simple Example: Hello World</h2>
    <pre><code class="language-cpp" data-noescape="" data-trim="" data-line-numbers="">
#include &lt;iostream&gt;
#include &lt;boost/asio.hpp&gt;

namespace async = boost::asio;

int main() {
    async::io_context io;

    async::post(io, []() {
        std::cout &lt;&lt; "Hello World" &lt;&lt; std::endl;
    });

    io.run();
}
</code></pre>
